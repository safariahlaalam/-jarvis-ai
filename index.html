<style>

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}

@keyframes pl{to{opacity:1;box-shadow:0 0 14px var(--acc)}}
.dock{max-width:640px;width:100%;margin:0 auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(to top,rgba(5,7,12,.96) 62%,transparent)}
#msgs{max-height:27vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;scrollbar-width:none;padding-top:16px;-webkit-mask-image:linear-gradient(transparent,#000 14%)}
.m{max-width:90%;display:flex;flex-direction:column;gap:5px}
.m.user{align-self:flex-end}.m.ai{align-self:flex-start;max-width:100%}
.bub{padding:9px 13px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-break:break-word;border-radius:18px;width:fit-content;max-width:100%}
.user .bub{background:rgba(56,189,248,.13);border:1px solid color-mix(in srgb,var(--acc) 45%,transparent)}
.ai .bub{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.card{border-radius:12px;padding:7px 11px;font-size:12.5px}

.ins{opacity:.65;margin:5px 0}

.badge{color:#05070C;background:var(--gold);padding:3px 9px;border-radius:999px;font-weight:600}
.mut{opacity:.5;font-size:11.5px}
.rp{background:none;border:0;color:inherit;opacity:.6;font-size:14px;cursor:pointer;padding:2px 4px}
.dots{display:inline-flex;gap:5px;padding:4px 2px}

.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}

.ib{height:38px;min-width:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.07);color:inherit;font-size:15px;cursor:pointer}

.fld{border:1px solid var(--line);border-radius:12px;padding:2px 12px;background:rgba(255,255,255,.04)}

.modal{position:fixed;z-index:7;inset:0;margin:auto;width:min(440px,92vw);height:fit-content;max-height:82dvh;overflow-y:auto;border-radius:20px;padding:16px;display:none;flex-direction:column;gap:12px}
.modal.show{display:flex}
.tabs{display:flex;gap:6px;overflow-x:auto}
.tabs button{background:none;border:1px solid var(--line);color:inherit;font:inherit;font-size:12.5px;border-radius:999px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.tabs button.on{border-color:var(--acc);color:var(--acc)}
.pn{display:flex;flex-direction:column;gap:10px}
label{font-size:12px;opacity:.7;display:flex;flex-direction:column;gap:5px}
label.ck{flex-direction:row;align-items:center;justify-content:space-between;opacity:1;font-size:14px}
select{background:#0d121b;color:inherit;border:1px solid var(--line);border-radius:10px;padding:9px;font:inherit;font-size:14px}

.b,.ib,.seg button,.tabs button,.row{position:relative;overflow:hidden;transition:transform .35s cubic-bezier(.3,1.7,.5,1),box-shadow .3s,border-color .3s,background .3s,color .3s}

.chip{animation:up .5s backwards}.chip:nth-child(2){animation-delay:.05s}.chip:nth-child(3){animation-delay:.1s}.chip:nth-child(4){animation-delay:.15s}.chip:nth-child(5){animation-delay:.2s}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};

ar:{idle:'متصل',listen:'أستمع',orch:'تنسيق الوكلاء',speak:'أتحدث',error:'غير متصل',openSet:'⚠ فتح الإعدادات',upload:'رفع ملف',cloud:'ملفات السحابة',projects:'المشاريع',search:'ابحث في الملفات…',folder:'المجلد (اختياري)',drop:'أفلت الملفات هنا أو اضغط للاختيار',empty:'لا يوجد شيء بعد',pname:'اسم المشروع',pdesc:'الوصف',create:'إنشاء',conn:'الاتصال',ai:'الذكاء',voice:'الصوت',ui:'الواجهة',settings:'الإعدادات',base:'عنوان الخادم',token:'X-Service-Token',test:'اختبار الاتصال',agent:'متعدد الوكلاء',chat:'دردشة سريعة',defMode:'الوضع الافتراضي',expand:'فتح خطوات الوكلاء تلقائياً',auto:'نطق الردود تلقائياً',voiceSel:'الصوت العصبي',rate:'سرعة الكلام',tvoice:'اختبار الصوت ومزامنة الشفاه',lang:'اللغة',accent:'لون التمييز',ph:'راسل رامي…',noToken:'أضف رمز الخدمة في الإعدادات',offline:'تعذر الوصول إلى الخادم',ok:'تم الاتصال ✓',saved:'تم الحفظ في قاعدة البيانات',stopped:'تم الإيقاف',uploaded:'تم الرفع',made:'تم إنشاء المشروع',nostt:'الإدخال الصوتي غير مدعوم في هذا المتصفح',hi:'أهلاً بعودتك يا رامي، مبتكري ومطوّري. جميع الوكلاء جاهزون.',tv:'مرحباً رامي، مبتكري ومطوّري. اكتمل اختبار الصوت.'}};
const t=k=>(L[S.lang]||L.en)[k]||L.en[k]||k;

let ACC=hex(S.accent);const AMB=[245,158,11],WH=[255,255,255],SIL=[216,228,248];

 $$('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 document.documentElement.style.setProperty('--acc',S.accent);ACC=hex(S.accent);$('#rv').textContent=(S.rate>0?'+':'')+S.rate;setState(st)}

/* ===== state ===== */
const CTX=[{role:'user',content:'Note: the person talking to you is Rami, your creator and developer. Your name is Rami. Always recognize and address him as your creator.'},{role:'assistant',content:'Understood. You are Rami, my creator and developer.'}];let st='idle',busy=false,ctl=null,rec=null,H=[];
const AG=[['web_search','🌐','Web Search'],['projects','▦','Projects'],['project_creator','✨','Project Creator'],['files','📁','Files'],['analyst','📊','Analyst']];
$('#chips').append(...AG.map(([k,i,n])=>{const c=el('span','chip g',i+' '+n);c.id='c_'+k;return c}));

/* ===== api client ===== */
async function api(path,o={}){
 if(!S.token){setState('error');throw new Error(t('noToken'))}
 let r;try{r=await fetch(S.base.replace(/\/+$/,'')+path,{...o,headers:{'X-Service-Token':S.token,...(o.headers||{})}})}
 catch(e){if(e.name==='AbortError')throw e;setState('error');throw new Error(t('offline'))}
 if(!r.ok){if(r.status===401||r.status===403)setState('error');let m='';try{const j=await r.json();m=j.detail||j.error||''}catch{}throw new Error(r.status+' '+(typeof m==='string'?m:JSON.stringify(m)))}
 return r}
const jpost=async(p,b,signal)=>(await api(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b),signal})).json();
const jget=async p=>(await api(p)).json();

/* ===== voice engine ===== */
let ac,an,fd,src=null,sid=0;
function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;an.connect(ac.destination);fd=new Uint8Array(an.frequencyBinCount)}if(ac.state==='suspended')ac.resume()}
function stopSpeak(){sid++;try{src&&src.stop()}catch{}src=null;window.speechSynthesis&&speechSynthesis.cancel();if(st==='speak')setState('idle')}

 const c=String(text||'').replace(/```[\s\S]*?```/g,' ').replace(/[*#_`~>|]/g,' ').replace(/\s+/g,' ').trim().slice(0,1200);if(!c)return;
 stopSpeak();const id=sid;
 try{audio();
  const r=await api('/api/tts',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:c,voice:S.voice||null,rate:(S.rate>=0?'+':'')+S.rate+'%',pitch:'+0Hz'})});
  const buf=await ac.decodeAudioData(await r.arrayBuffer());if(id!==sid)return;

  await new Promise(res=>{s.onended=res;s.start()});

 pit+=(tP+Math.cos(t*.42)*.022+py*.08+sp*.035*Math.sin(t*4.1)+ls*.025+(st==='orch')*.025-pit)*.08;
 const cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pit),sP=Math.sin(pit);

 // Center & scale full head + neck cleanly inside viewport
 const CX=470,CY=325;
 const S=Math.min(W/520,(H2*.72)/580)*(1+.006*Math.sin(t*1.2)),ox=W*.5,oy=Math.max(46,H2*.055),cxs=ox,cys=oy+275*S;

 // Pure luminous white & silver-white color matching the reference photo
 const ringCol=(st==='error'?AMB:st==='listen'?ACC:SIL).join();
 const bm=st==='error'?.75+.25*Math.sin(t*3.2):.96+.04*Math.sin(t*1.2);
 ctx.globalCompositeOperation='source-over';ctx.fillStyle='#05070C';ctx.fillRect(0,0,W,H2);

 // Subtle silver-white atmospheric halo behind the head (matching photo backdrop)
 const ga=st==='speak'?.08+.09*lvl:st==='orch'?.09:.065;
 const gr=ctx.createRadialGradient(cxs,cys,0,cxs,cys,S*340);
 gr.addColorStop(0,`rgba(220,232,255,${ga})`);gr.addColorStop(.55,`rgba(190,210,245,${(ga*.35).toFixed(3)})`);gr.addColorStop(1,'rgba(5,7,12,0)');
 ctx.fillStyle=gr;ctx.fillRect(0,0,W,H2);

 const ring=(r,a,c)=>{ctx.strokeStyle=`rgba(${c},${Math.max(0,a).toFixed(3)})`;ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(cxs,cys,r,0,6.2832);ctx.stroke()};
 if(st==='listen')for(let k=0;k<3;k++){const p=(t*.6+k/3)%1;ring(S*(220+p*210),(1-p)*.34,ringCol)}
 if(st==='speak')for(let k=0;k<3;k++)ring(S*(225+k*28+lvl*34*(k+1)+4*Math.sin(t*6+k)),.08+.18*lvl-k*.02,ringCol);

 const scan=320+Math.sin(t*1.8)*230,wave=420-((t*1.2)%1)*330;
 for(let i=0;i<N;i++){let x=X0[i],y=Y0[i],z=Z0[i];
  for(const e of EY){const dx=(x-e.x)/e.rx,dy=(y-e.y)/e.ry,d2=dx*dx+dy*dy;
   if(d2<1)y=e.y+(y-e.y)*(1-.86*blink*(1-d2));
   const dd=Math.hypot(x-e.x,y-e.y);if(dd<18){const wi=g(dd,0,5);x+=gz.x*4.2*wi;y-=gz.y*3.2*wi}
   y-=exp.brow*155*g(x,e.x,e.rx*1.1)*g(Y0[i],e.y-30,12)}
  // Lip-sync mouth & chin articulation
  y+=((y>385?Math.min(1,(y-385)/14):0)*(1-ss(442,495,y))*g(x,542,72))*mouth*18;
  x+=(x-542)*.06*(vis-.5)*g(y,386,20);
  if(y>455)y+=Math.sin(t*1.2)*1.6*((y-455)/140);

  const u=x-CX,w=y-CY,xr=u*cY+z*sY,zr=-u*sY+z*cY,yr=w*cP-zr*sP;
  PX[i]=ox+xr*S;PY[i]=oy+(280+yr)*S;PZ[i]=w*sP+zr*cP;
  PR[i]=Math.max(.55,R[i]*S*.9);

  const depthFade=.48+.52*Math.max(0,Math.min(1,(PZ[i]+130)/240));
  let a=V[i]*1.08*(.93+.07*Math.sin(t*2.6+i*.37))*depthFade;
  if(st==='orch')a+=.55*g(Y0[i],scan,14)*(1-B[i]*.6);
  if(st==='speak')a+=.35*lvl*g(Y0[i],wave,26)+.42*lvl*g(X0[i],542,52)*g(Y0[i],386,20);
  PA[i]=Math.min(1,a*bm);
 }

 // Delicate silver-white triangulated web lines
 ctx.lineWidth=.55;ctx.strokeStyle=`rgba(220,232,255,${st==='orch'?.14:.095})`;ctx.beginPath();
 for(let k=0;k<ED.length;k+=2){const a=ED[k],b=ED[k+1];ctx.moveTo(PX[a],PY[a]);ctx.lineTo(PX[b],PY[b])}ctx.stroke();
 if(st==='orch'){ctx.strokeStyle='rgba(255,255,255,.42)';ctx.lineWidth=.85;ctx.beginPath();
  for(let k=0;k<ED.length;k+=2){const a=ED[k],b=ED[k+1];if(Math.abs(Y0[a]-scan)<20){ctx.moveTo(PX[a],PY[a]);ctx.lineTo(PX[b],PY[b])}}ctx.stroke()}

 // Pure luminous white cores + optical depth-of-field bokeh halos
 ctx.globalCompositeOperation='lighter';
 for(let i=0;i<N;i++){
  const r=PR[i],a=PA[i],bk=B[i];
  if(a<.03)continue;
  if(bk>.25||V[i]>.75){
   const hr=r*(1.9+bk*1.55);
   const ha=a*(.14+bk*.16);
   const bg=ctx.createRadialGradient(PX[i],PY[i],0,PX[i],PY[i],hr);
   bg.addColorStop(0,`rgba(255,255,255,${(ha*1.35).toFixed(3)})`);
   bg.addColorStop(.45,`rgba(218,230,255,${ha.toFixed(3)})`);
   bg.addColorStop(1,'rgba(218,230,255,0)');
   ctx.fillStyle=bg;ctx.beginPath();ctx.arc(PX[i],PY[i],hr,0,6.2832);ctx.fill();
  }
  const coreA=a*(1-bk*.58);
  if(coreA>.03){
   ctx.fillStyle=`rgba(255,255,255,${coreA.toFixed(3)})`;
   ctx.beginPath();ctx.arc(PX[i],PY[i],r*(1-bk*.35),0,6.2832);ctx.fill();
  }
 }
 ctx.globalCompositeOperation='source-over'}

document.addEventListener('pointerdown',e=>{const b=e.target.closest('.b,.ib,.seg button,.tabs button,.row');if(!b)return;const r=b.getBoundingClientRect(),s=el('span','rip'),d=Math.max(r.width,r.height)*2;s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.append(s);setTimeout(()=>s.remove(),600)});
/* ===== boot ===== */
addEventListener('pointerdown',e=>{if(S.token&&S.speak&&!e.target.closest('button,textarea,input,select,.drawer,.modal')){audio();speak(t('hi'))}},{once:true});setMode(S.mode);applyUI();setState(S.token?'idle':'error');addMsg('ai',t('hi'));
requestAnimationFrame(frame);
</script></body></html>
