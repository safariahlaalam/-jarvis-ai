<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050b16">

<title>RAMI AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050b16;
  color: #d9f4ff;
  font-family: Arial, sans-serif;
  min-height: 100vh;
}

header {
  padding: 24px;
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid #16344b;
}

.logo {
  letter-spacing: 5px;
  color: #53dfff;
  font-size: 22px;
}

.status {
  color: #4de8b0;
  font-size: 12px;
}

main {
  text-align: center;
  padding: 35px 20px;
}

.orb {
  width: 190px;
  height: 190px;
  margin: 35px auto;
  border-radius: 50%;
  border: 2px solid #31cfff;
  box-shadow: 0 0 25px #078acb,
              inset 0 0 30px #078acb;
  background: radial-gradient(
    circle,
    #164c78,
    #071729 65%,
    #020710
  );
  animation: pulse 3s infinite alternate;
}

@keyframes pulse {
  from {
    box-shadow: 0 0 15px #078acb;
  }
  to {
    box-shadow: 0 0 55px #078acb;
  }
}

h2 {
  font-weight: 300;
  letter-spacing: 3px;
}

#messages {
  margin: 30px auto;
  max-width: 550px;
  text-align: left;
}

.message {
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #16405b;
  border-radius: 12px;
  background: #0a1726;
  line-height: 1.5;
  white-space: pre-wrap;
}

.controls {
  display: flex;
  gap: 8px;
  max-width: 550px;
  margin: auto;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 10px;
  border: 1px solid #236080;
  background: #0b1929;
  color: white;
  font-size: 16px;
}

button {
  padding: 14px;
  border: 1px solid #27bde9;
  border-radius: 10px;
  background: #103d5a;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:active {
  background: #087da9;
}

footer {
  color: #54758b;
  font-size: 11px;
  padding: 25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">R.A.M.I</div>
  <div class="status">● SYSTEM ONLINE</div>
</header>

<main>

  <div class="orb"></div>

  <h2>AT YOUR SERVICE</h2>
  <p>Personal Artificial Intelligence</p>

  <div id="messages">
    <div class="message">
      <strong>RAMI:</strong><br>
      Good day. My interface is operational.
      Awaiting your instructions.
    </div>
  </div>

  <div class="controls">
    <input
      id="input"
      placeholder="Talk to RAMI..."
      autocomplete="off"
    >
    <button onclick="sendMessage()">Send</button>
    <button onclick="listen()">🎙️</button>
  </div>

</main>

<footer>
  RAMI AI — DEVELOPMENT VERSION 1.0
</footer>

<script>

const WORKER_URL = "https://jarvis-worker.5rk2sbwzjp.workers.dev/";

function addMessage(sender, text) {
  const box = document.getElementById("messages");

  const message = document.createElement("div");
  message.className = "message";

  const title = document.createElement("strong");
  title.textContent = sender + ":";

  const content = document.createElement("div");
  content.textContent = text;

  message.append(title, document.createElement("br"), content);
  box.appendChild(message);

  message.scrollIntoView({ behavior: "smooth" });
  return content;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();

  if (!text) return;

  addMessage("RAMI", text);
  input.value = "";

  const replyContent = addMessage("RAMI AI", "Processing...");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ prompt: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error (" + response.status + ")");
    }

    replyContent.textContent = data.reply;
  } catch (err) {
    replyContent.textContent = "Error: " + err.message;
  }
}

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      "RAMI AI",
      "Voice recognition is not supported by this browser. Please use text input for now."
    );
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.start();

  recognition.onresult = function(event) {
    document.getElementById("input").value =
      event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    addMessage("RAMI AI", "I couldn't access voice recognition.");
  };
}

document.getElementById("input")
  .addEventListener("keydown", function(event) {
    if (event.key === "Enter") sendMessage();
  });

</script>

</body>
</html>
