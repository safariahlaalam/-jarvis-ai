<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>RAMI AI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100dvh;
  background: #000000;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* Fullscreen Interactive 3D Canvas */
#faceCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  z-index: 1;
}

/* HUD Layout */
.hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

header {
  padding: 14px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(0, 0, 0, 0.88), rgba(0, 0, 0, 0));
}

.logo {
  letter-spacing: 6px;
  font-size: 16px;
  font-weight: 600;
  color: #ffffff;
  text-shadow: 0 0 14px rgba(255, 255, 255, 0.45);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.status {
  font-size: 11px;
  letter-spacing: 1.4px;
  color: rgba(255, 255, 255, 0.72);
  text-transform: uppercase;
  transition: color 0.2s, text-shadow 0.2s;
}

.status.active {
  color: #ffffff;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
}

.voice-toggle {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.22);
  color: #ffffff;
  font-size: 11px;
  letter-spacing: 0.8px;
  padding: 6px 11px;
  border-radius: 999px;
  cursor: pointer;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: opacity 0.2s, background 0.2s;
}

.voice-toggle.muted {
  opacity: 0.45;
}

/* Smooth Texting App Bottom Dock */
.bottom-dock {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: 10px 14px 16px;
  background: linear-gradient(to top, rgba(0, 0, 0, 0.96) 58%, rgba(0, 0, 0, 0));
  pointer-events: auto;
  display: flex;
  flex-direction: column;
}

#messages {
  max-height: 31vh;
  overflow-y: auto;
  padding: 6px 4px 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  scroll-behavior: smooth;
  scrollbar-width: none;
  mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 14%, black 100%);
}

#messages::-webkit-scrollbar {
  display: none;
}

@keyframes msgPop {
  0% {
    opacity: 0;
    transform: translateY(10px) scale(0.97);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.msg-row {
  display: flex;
  flex-direction: column;
  max-width: 84%;
  animation: msgPop 0.26s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}

.msg-row.user {
  align-self: flex-end;
  align-items: flex-end;
}

.msg-row.ai {
  align-self: flex-start;
  align-items: flex-start;
}

.agent-badge {
  font-size: 9.5px;
  letter-spacing: 1.3px;
  color: rgba(255, 255, 255, 0.48);
  text-transform: uppercase;
  margin: 0 0 4px 6px;
}

.bubble {
  padding: 10px 14px;
  font-size: 14.5px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
}

.msg-row.user .bubble {
  background: rgba(255, 255, 255, 0.16);
  border: 1px solid rgba(255, 255, 255, 0.28);
  color: #ffffff;
  border-radius: 18px 18px 4px 18px;
}

.msg-row.ai .bubble {
  background: rgba(16, 16, 18, 0.78);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: rgba(255, 255, 255, 0.94);
  border-radius: 18px 18px 18px 4px;
}

/* Smooth 3-dot Typing Indicator */
.typing-dots {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 2px;
}

.typing-dots span {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.75);
  animation: dotBounce 1.2s infinite ease-in-out;
}

.typing-dots span:nth-child(2) { animation-delay: 0.18s; }
.typing-dots span:nth-child(3) { animation-delay: 0.36s; }

@keyframes dotBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
  40% { transform: translateY(-4px); opacity: 1; }
}

/* Input & Action Bar (Input + Send + Stop + Mic) */
.composer {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  background: rgba(18, 18, 20, 0.85);
  border: 1px solid rgba(255, 255, 255, 0.2);
  border-radius: 22px;
  padding: 6px 7px 6px 14px;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: border-color 0.2s;
}

.composer:focus-within {
  border-color: rgba(255, 255, 255, 0.55);
}

textarea {
  flex: 1;
  min-width: 0;
  max-height: 96px;
  border: none;
  background: transparent;
  color: #ffffff;
  font-family: inherit;
  font-size: 16px;
  line-height: 1.35;
  padding: 7px 0;
  resize: none;
  outline: none;
}

textarea::placeholder {
  color: rgba(255, 255, 255, 0.38);
}

.icon-btn {
  height: 38px;
  min-width: 38px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  flex-shrink: 0;
  transition: transform 0.12s, background 0.2s, border-color 0.2s, opacity 0.2s;
}

.icon-btn:active {
  transform: scale(0.94);
}

.send-btn {
  background: #ffffff;
  color: #000000;
  border-color: #ffffff;
  font-weight: 600;
}

.stop-btn {
  background: rgba(255, 75, 75, 0.14);
  border-color: rgba(255, 95, 95, 0.35);
  color: rgba(255, 190, 190, 0.75);
  padding: 0 11px;
}

.stop-btn.armed {
  background: rgba(255, 65, 65, 0.32);
  border-color: #ff6b6b;
  color: #ffffff;
  box-shadow: 0 0 14px rgba(255, 75, 75, 0.45);
}

.mic-btn.listening {
  background: rgba(255, 255, 255, 0.3);
  border-color: #ffffff;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.5);
}
</style>
</head>

<body>

<canvas id="faceCanvas"></canvas>

<div class="hud">
  <header>
    <div class="logo">R.A.M.I</div>
    <div class="header-right">
      <div id="statusText" class="status">● ONLINE</div>
      <button id="voiceBtn" class="voice-toggle" onclick="toggleVoice()">🔊 VOICE ON</button>
    </div>
  </header>

  <div class="bottom-dock">
    <div id="messages">
      <div class="msg-row ai">
        <div class="agent-badge">ORCHESTRATOR • READY</div>
        <div class="bubble">Good day, Rami. My neural agents are synchronized and ready. Type or tap the mic to talk.</div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" rows="1" placeholder="Message RAMI..." autocomplete="off"></textarea>
      <button class="icon-btn send-btn" onclick="sendMessage()" title="Send">Send</button>
      <button id="stopBtn" class="icon-btn stop-btn" onclick="stopAllActivity()" title="Stop searching or speaking">■</button>
      <button id="micBtn" class="icon-btn mic-btn" onclick="listen()" title="Voice Input">🎙️</button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://jarvis-worker.5rk2sbwzjp.workers.dev";

// ==========================================================
// 1. STATE, ABORT CONTROL & STOP BUTTON
// ==========================================================
let voiceEnabled = true;
let isThinking = false;
let isSpeaking = false;
let isListening = false;
let speechGenerationId = 0;
let startupGreeted = false;

let activeFetchController = null;
let activeRecognition = null;
let currentAudio = null;
let audioCtx = null;
let analyserNode = null;
let analyserData = null;
let liveAudioLevel = 0;

const conversationHistory = [];

function updateUIState(statusLabel, active = false) {
  const statusEl = document.getElementById("statusText");
  statusEl.textContent = "● " + statusLabel;
  statusEl.classList.toggle("active", active);

  const stopBtn = document.getElementById("stopBtn");
  stopBtn.classList.toggle("armed", isThinking || isSpeaking || isListening);
}

function stopAllActivity() {
  speechGenerationId++;

  // 1. Abort active network search / multi-agent call
  if (activeFetchController) {
    activeFetchController.abort();
    activeFetchController = null;
  }

  // 2. Stop Orpheus neural audio playback
  if (currentAudio) {
    try {
      currentAudio.pause();
      currentAudio.src = "";
    } catch (_) {}
    currentAudio = null;
  }

  // 3. Stop browser speech synthesis
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  // 4. Stop active voice recognition
  if (activeRecognition) {
    try {
      activeRecognition.abort();
    } catch (_) {}
    activeRecognition = null;
  }

  isThinking = false;
  isSpeaking = false;
  isListening = false;
  liveAudioLevel = 0;
  document.getElementById("micBtn").classList.remove("listening");
  updateUIState("ONLINE", false);
}

// ==========================================================
// 2. REALISTIC NEURAL VOICE + AMPLITUDE LIP-SYNC
// ==========================================================
let preferredBrowserVoice = null;

function loadBrowserVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  preferredBrowserVoice =
    voices.find(v => v.lang.startsWith("en") && /Natural|Neural|Premium|Enhanced|Daniel|Arthur|Alex|Google UK English Male/i.test(v.name)) ||
    voices.find(v => v.lang.startsWith("en") && v.localService) ||
    voices.find(v => v.lang.startsWith("en")) ||
    voices[0];
}

if ("speechSynthesis" in window) {
  loadBrowserVoices();
  window.speechSynthesis.onvoiceschanged = loadBrowserVoices;
}

function unlockAudioSystems() {
  try {
    if (!audioCtx) {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (AudioContextClass) {
        audioCtx = new AudioContextClass();
        analyserNode = audioCtx.createAnalyser();
        analyserNode.fftSize = 256;
        analyserData = new Uint8Array(analyserNode.frequencyBinCount);
      }
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  } catch (_) {}

  if ("speechSynthesis" in window && !window._ttsUnlocked) {
    const s = new SpeechSynthesisUtterance("");
    s.volume = 0;
    window.speechSynthesis.speak(s);
    window._ttsUnlocked = true;
  }
}

window.addEventListener("touchstart", unlockAudioSystems, { once: true });
window.addEventListener("click", unlockAudioSystems, { once: true });

function toggleVoice() {
  unlockAudioSystems();
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById("voiceBtn");
  if (voiceEnabled) {
    btn.textContent = "🔊 VOICE ON";
    btn.classList.remove("muted");
    speakText("Voice output active.");
  } else {
    btn.textContent = "🔇 MUTED";
    btn.classList.add("muted");
    speechGenerationId++;
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    isSpeaking = false;
    liveAudioLevel = 0;
    updateUIState("ONLINE", false);
  }
}

// Split reply into natural sentence chunks <= 185 chars for Groq Orpheus TTS
function splitIntoVoiceChunks(text) {
  const clean = text
    .replace(/```[\s\S]*?```/g, " Code block provided on screen. ")
    .replace(/[*#_`~>|[\]]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (!clean) return [];

  const sentences = clean.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [clean];
  const chunks = [];

  for (let s of sentences) {
    s = s.trim();
    if (!s) continue;
    while (s.length > 185) {
      let cut = s.lastIndexOf(",", 185);
      if (cut < 60) cut = s.lastIndexOf(" ", 185);
      if (cut < 40) cut = 185;
      chunks.push(s.slice(0, cut).trim());
      s = s.slice(cut).trim();
    }
    if (s) chunks.push(s);
  }
  return chunks.slice(0, 8);
}

async function fetchOrpheusChunkBlob(chunkText, signal) {
  const res = await fetch(`${WORKER_URL}/tts`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: chunkText, voice: "daniel" }),
    signal,
  });
  if (!res.ok) throw new Error("Orpheus TTS unavailable");
  return await res.blob();
}

function playBlobWithLipSync(blob, genId, isGreeting = false) {
  return new Promise((resolve, reject) => {
    if (genId !== speechGenerationId) return resolve();

    const objectUrl = URL.createObjectURL(blob);
    const audio = new Audio(objectUrl);
    audio.crossOrigin = "anonymous";
    currentAudio = audio;

    try {
      if (audioCtx && analyserNode) {
        const source = audioCtx.createMediaElementSource(audio);
        source.connect(analyserNode);
        analyserNode.connect(audioCtx.destination);
      }
    } catch (_) {}

    audio.onended = () => {
      URL.revokeObjectURL(objectUrl);
      if (currentAudio === audio) currentAudio = null;
      resolve();
    };

    audio.onerror = (e) => {
      URL.revokeObjectURL(objectUrl);
      if (currentAudio === audio) currentAudio = null;
      reject(e);
    };

    audio.play()
      .then(() => {
        if (isGreeting) startupGreeted = true;
      })
      .catch(reject);
  });
}

function speakWithBrowserFallback(text, genId, isGreeting = false) {
  if (!("speechSynthesis" in window) || genId !== speechGenerationId) return;
  window.speechSynthesis.cancel();
  if (!preferredBrowserVoice) loadBrowserVoices();

  const utterance = new SpeechSynthesisUtterance(text);
  if (preferredBrowserVoice) utterance.voice = preferredBrowserVoice;
  utterance.rate = 0.97;
  utterance.pitch = 0.94;

  utterance.onstart = () => {
    if (genId !== speechGenerationId) return;
    if (isGreeting) startupGreeted = true;
    isSpeaking = true;
    updateUIState("SPEAKING", true);
  };

  utterance.onend = () => {
    if (genId !== speechGenerationId) return;
    isSpeaking = false;
    liveAudioLevel = 0;
    updateUIState("ONLINE", false);
  };

  utterance.onerror = () => {
    if (genId !== speechGenerationId) return;
    isSpeaking = false;
    liveAudioLevel = 0;
    updateUIState("ONLINE", false);
  };

  window.speechSynthesis.speak(utterance);
}

async function speakText(rawText, isGreeting = false) {
  if (!voiceEnabled) return;
  const chunks = splitIntoVoiceChunks(rawText);
  if (!chunks.length) return;

  const genId = ++speechGenerationId;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();

  isSpeaking = true;
  updateUIState("SPEAKING", true);

  try {
    let nextBlobPromise = fetchOrpheusChunkBlob(chunks[0], activeFetchController?.signal);

    for (let i = 0; i < chunks.length; i++) {
      if (genId !== speechGenerationId || !voiceEnabled) break;
      const blob = await nextBlobPromise;

      if (i + 1 < chunks.length && genId === speechGenerationId) {
        nextBlobPromise = fetchOrpheusChunkBlob(chunks[i + 1], activeFetchController?.signal);
      }

      if (genId !== speechGenerationId || !voiceEnabled) break;
      await playBlobWithLipSync(blob, genId, isGreeting);
    }

    if (genId === speechGenerationId) {
      isSpeaking = false;
      liveAudioLevel = 0;
      updateUIState("ONLINE", false);
    }
  } catch (_) {
    if (genId === speechGenerationId && voiceEnabled) {
      speakWithBrowserFallback(chunks.join(" "), genId, isGreeting);
    }
  }
}

// ==========================================================
// 3. SMOOTH TEXTING APP MESSAGES & ORCHESTRATOR CALL
// ==========================================================
const messagesBox = document.getElementById("messages");
const inputEl = document.getElementById("input");

inputEl.addEventListener("input", () => {
  inputEl.style.height = "auto";
  inputEl.style.height = Math.min(inputEl.scrollHeight, 96) + "px";
});

inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function scrollToBottom() {
  requestAnimationFrame(() => {
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
}

function appendUserMessage(text) {
  const row = document.createElement("div");
  row.className = "msg-row user";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  row.appendChild(bubble);
  messagesBox.appendChild(row);
  scrollToBottom();
}

function appendTypingBubble() {
  const row = document.createElement("div");
  row.className = "msg-row ai";

  const badge = document.createElement("div");
  badge.className = "agent-badge";
  badge.textContent = "ORCHESTRATOR • COORDINATING AGENTS";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div>`;

  row.append(badge, bubble);
  messagesBox.appendChild(row);
  scrollToBottom();
  return { row, badge, bubble };
}

async function sendMessage() {
  unlockAudioSystems();
  const text = inputEl.value.trim();
  if (!text) return;

  speechGenerationId++;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  isSpeaking = false;

  if (activeFetchController) activeFetchController.abort();
  activeFetchController = new AbortController();

  appendUserMessage(text);
  inputEl.value = "";
  inputEl.style.height = "auto";

  isThinking = true;
  updateUIState("ORCHESTRATING", true);
  const typing = appendTypingBubble();

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        prompt: text,
        history: conversationHistory.slice(-6),
      }),
      signal: activeFetchController.signal,
    });

    const data = await response.json();
    if (!response.ok) {
      throw new Error(data.error || `Server error (${response.status})`);
    }

    const agentsLabel = Array.isArray(data.agents) && data.agents.length
      ? data.agents.join(" → ")
      : "RAMI AI";

    typing.badge.textContent = agentsLabel;
    typing.bubble.textContent = data.reply;
    scrollToBottom();

    conversationHistory.push({ role: "user", content: text });
    conversationHistory.push({ role: "assistant", content: data.reply });

    isThinking = false;
    activeFetchController = null;
    updateUIState("ONLINE", false);

    speakText(data.reply);
  } catch (err) {
    isThinking = false;
    activeFetchController = null;

    if (err.name === "AbortError") {
      typing.badge.textContent = "STOPPED";
      typing.bubble.textContent = "Stopped.";
    } else {
      typing.badge.textContent = "SYSTEM NOTICE";
      typing.bubble.textContent = "Error: " + err.message;
    }
    scrollToBottom();
    updateUIState("ONLINE", false);
  }
}

function listen() {
  unlockAudioSystems();
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    const typing = appendTypingBubble();
    typing.badge.textContent = "SYSTEM";
    typing.bubble.textContent = "Voice input is not supported in this browser. Please type below.";
    return;
  }

  if (isListening && activeRecognition) {
    activeRecognition.stop();
    return;
  }

  speechGenerationId++;
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
  }
  if ("speechSynthesis" in window) window.speechSynthesis.cancel();
  isSpeaking = false;

  const micBtn = document.getElementById("micBtn");
  const recognition = new SpeechRecognition();
  activeRecognition = recognition;
  recognition.lang = "en-US";
  recognition.interimResults = false;

  isListening = true;
  micBtn.classList.add("listening");
  updateUIState("LISTENING", true);
  recognition.start();

  recognition.onresult = (event) => {
    isListening = false;
    activeRecognition = null;
    micBtn.classList.remove("listening");
    inputEl.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    isListening = false;
    activeRecognition = null;
    micBtn.classList.remove("listening");
    if (!isThinking && !isSpeaking) updateUIState("ONLINE", false);
  };

  recognition.onend = () => {
    isListening = false;
    activeRecognition = null;
    micBtn.classList.remove("listening");
    if (!isThinking && !isSpeaking) updateUIState("ONLINE", false);
  };
}

// ==========================================================
// 4. PHOTOREALISTIC 3D DOT-MATRIX HUMANOID FACE
// ==========================================================
const canvas = document.getElementById("faceCanvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

function gauss(x, mu, sigma) {
  const d = (x - mu) / sigma;
  return Math.exp(-0.5 * d * d);
}

function smoothstep(edge0, edge1, x) {
  const t = Math.max(0, Math.min(1, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

const headVertices = [];
const meshEdges = [];
const eyeDetails = [];
const ambientBokeh = [];

function sampleFaceSurfaceZ(x, y) {
  const absX = Math.abs(x);

  const rx = y > 0 ? 0.72 : 0.72 * (1 - 0.34 * Math.pow(Math.min(1, -y / 0.85), 1.45));
  const ry = 1.12;
  const normR2 = (x / rx) * (x / rx) + ((y - 0.08) / ry) * ((y - 0.08) / ry);
  let z = Math.sqrt(Math.max(0.02, 1 - Math.min(0.98, normR2))) * 0.82;

  const brow = gauss(y, 0.36, 0.055) * gauss(absX, 0.24, 0.22);
  z += 0.075 * brow;

  const glabella = gauss(y, 0.34, 0.05) * gauss(x, 0, 0.08);
  z += 0.045 * glabella;

  const socket = gauss(y, 0.245, 0.068) * gauss(absX, 0.255, 0.105);
  z -= 0.135 * socket;

  const bridgeMask = smoothstep(0.36, 0.28, y) * smoothstep(-0.06, 0.04, y);
  const noseBridge = bridgeMask * gauss(x, 0, 0.068);
  const noseTip = gauss(y, -0.02, 0.052) * gauss(x, 0, 0.078);
  const nostrilWing = gauss(y, -0.045, 0.042) * gauss(absX, 0.105, 0.048);
  z += 0.135 * noseBridge + 0.165 * noseTip + 0.078 * nostrilWing;

  const cheek = gauss(y, 0.10, 0.11) * gauss(absX, 0.36, 0.14);
  z += 0.072 * cheek;

  const philtrum = gauss(y, -0.145, 0.045) * gauss(absX, 0.032, 0.025);
  z += 0.022 * philtrum;

  const upperLip = gauss(y, -0.205, 0.030) * gauss(absX, 0.055, 0.105);
  const lipPart = gauss(y, -0.242, 0.016) * gauss(x, 0, 0.145);
  const lowerLip = gauss(y, -0.282, 0.034) * gauss(x, 0, 0.125);
  const mouthCorner = gauss(y, -0.242, 0.032) * gauss(absX, 0.175, 0.045);
  z += 0.088 * upperLip - 0.065 * lipPart + 0.085 * lowerLip - 0.035 * mouthCorner;

  const chinCrease = gauss(y, -0.355, 0.035) * gauss(x, 0, 0.13);
  const chin = gauss(y, -0.445, 0.068) * gauss(x, 0, 0.145);
  z += -0.038 * chinCrease + 0.088 * chin;

  return z;
}

function buildHumanoidPointCloud() {
  const U_COUNT = 72;
  const V_COUNT = 58;

  for (let iv = 0; iv <= V_COUNT; iv++) {
    const v = iv / V_COUNT;
    const y = 1.20 - v * 2.48;

    let rx = 0.72;
    let rz = 0.82;

    if (v < 0.31) {
      const t = v / 0.31;
      const dome = Math.sin(t * Math.PI * 0.5);
      rx = 0.72 * Math.pow(dome, 0.58);
      rz = 0.82 * Math.pow(dome, 0.58);
    } else if (v < 0.67) {
      const t = (v - 0.31) / 0.36;
      rx = 0.72 * (1 - 0.37 * Math.pow(t, 1.45));
      rz = 0.82 * (1 - 0.23 * Math.pow(t, 1.35));
    } else if (v < 0.74) {
      const t = smoothstep(0.67, 0.74, v);
      rx = 0.45 * (1 - t) + 0.34 * t;
      rz = 0.63 * (1 - t) + 0.36 * t;
    } else {
      const t = (v - 0.74) / 0.26;
      const shoulderFlare = Math.pow(t, 2.1) * 0.38;
      rx = 0.34 + shoulderFlare;
      rz = 0.36 + shoulderFlare * 0.48;
    }

    for (let iu = 0; iu < U_COUNT; iu++) {
      const u = (iu / U_COUNT) * Math.PI * 2 - Math.PI;
      const absU = Math.abs(u);

      let x = rx * Math.sin(u);
      let z = rz * Math.cos(u);

      if (absU > 1.65 && v < 0.55) {
        const occ = gauss(v, 0.32, 0.15) * gauss(absU, Math.PI, 0.65);
        z -= 0.13 * occ;
      }

      const temple = gauss(v, 0.34, 0.11) * gauss(absU, 1.0, 0.32);
      x *= 1 - 0.075 * temple;

      const frontBlend = smoothstep(1.38, 0.75, absU) * smoothstep(0.14, 0.24, v) * smoothstep(0.71, 0.62, v);
      if (frontBlend > 0.001) {
        const targetZ = sampleFaceSurfaceZ(x, y);
        z = z * (1 - frontBlend) + targetZ * frontBlend;
      }

      const distLeftEye = Math.hypot((x + 0.255) / 0.13, (y - 0.245) / 0.065);
      const distRightEye = Math.hypot((x - 0.255) / 0.13, (y - 0.245) / 0.065);
      const distMouth = Math.hypot(x / 0.19, (y + 0.242) / 0.085);
      const isFront = absU < 1.35;

      const skipDot =
        isFront && (distLeftEye < 1.05 || distRightEye < 1.05 || distMouth < 0.92);

      const ear = gauss(v, 0.44, 0.062) * gauss(absU, 1.54, 0.085);
      if (ear > 0.12) {
        x += Math.sign(u) * 0.068 * ear;
        z -= 0.025 * ear;
      }

      const noseHighlight = isFront ? gauss(x, 0, 0.08) * gauss(y, 0.05, 0.22) : 0;
      const browHighlight = isFront ? gauss(y, 0.35, 0.045) * gauss(Math.abs(x), 0.24, 0.20) : 0;
      const cheekHighlight = isFront ? gauss(y, 0.10, 0.09) * gauss(Math.abs(x), 0.35, 0.14) : 0;

      const neckFade = v > 0.84 ? 1 - smoothstep(0.84, 1.0, v) : 1;

      const brightness =
        (0.56 + 0.55 * Math.max(noseHighlight, browHighlight, cheekHighlight * 0.85)) * neckFade;
      const sizeMult = 0.95 + 0.35 * Math.max(noseHighlight, browHighlight);

      let jawWeight = 0;
      if (isFront && y < -0.245 && y > -0.62 && Math.abs(x) < 0.42) {
        jawWeight =
          smoothstep(-0.245, -0.32, y) *
          (1 - smoothstep(-0.48, -0.62, y)) *
          Math.cos((Math.abs(x) / 0.42) * Math.PI * 0.5);
      }

      const idx = headVertices.length;
      headVertices.push({
        bx: x,
        by: y,
        bz: z,
        brightness,
        sizeMult,
        jawWeight,
        skipDot,
        isFront: absU < 1.48 && v < 0.96,
      });

      if (iv > 0 && iu > 0) {
        const prevU = idx - 1;
        const prevV = idx - U_COUNT;
        const prevDiag = idx - U_COUNT - 1;
        if (headVertices[idx].isFront && neckFade > 0.15) {
          meshEdges.push([idx, prevU]);
          meshEdges.push([idx, prevV]);
          if ((iv + iu) % 2 === 0) meshEdges.push([idx, prevDiag]);
        }
      }
    }
  }

  [-1, 1].forEach((side) => {
    const cx = side * 0.255;
    const cy = 0.245;

    const ringConfigs = [
      { rx: 0.105, ry: 0.042, count: 28, bright: 1.25, size: 1.05, isLid: true },
      { rx: 0.132, ry: 0.062, count: 32, bright: 1.12, size: 1.02, isLid: false },
      { rx: 0.162, ry: 0.084, count: 36, bright: 0.95, size: 0.98, isLid: false },
      { rx: 0.195, ry: 0.108, count: 40, bright: 0.82, size: 0.94, isLid: false },
    ];

    ringConfigs.forEach((rc) => {
      for (let i = 0; i < rc.count; i++) {
        const a = (i / rc.count) * Math.PI * 2;
        const cornerPinch = Math.pow(Math.abs(Math.cos(a)), 1.6);
        const px = cx + Math.cos(a) * rc.rx;
        const rawOffsetY = Math.sin(a) * rc.ry * (1 - 0.28 * cornerPinch);
        const py = cy + rawOffsetY;
        const pz = sampleFaceSurfaceZ(px, py) + (rc.isLid ? 0.016 : 0.008);

        eyeDetails.push({
          bx: px,
          cy,
          offsetY: rawOffsetY,
          bz: pz,
          isUpperLid: rc.isLid && Math.sin(a) > 0,
          isIris: false,
          brightness: rc.bright,
          sizeMult: rc.size,
        });
      }
    });

    const irisZ = sampleFaceSurfaceZ(cx, cy) + 0.006;
    for (let i = 0; i < 16; i++) {
      const a = (i / 16) * Math.PI * 2;
      eyeDetails.push({
        bx: cx + Math.cos(a) * 0.033,
        cy,
        offsetY: Math.sin(a) * 0.033,
        bz: irisZ,
        isUpperLid: false,
        isIris: true,
        brightness: 0.85,
        sizeMult: 0.88,
      });
    }
  });

  const mouthRings = [
    { rx: 0.145, ry: 0.024, count: 28, bright: 1.22, size: 1.05 },
    { rx: 0.175, ry: 0.048, count: 34, bright: 1.15, size: 1.02 },
    { rx: 0.212, ry: 0.075, count: 38, bright: 0.92, size: 0.96 },
  ];

  mouthRings.forEach((mr) => {
    for (let i = 0; i < mr.count; i++) {
      const a = (i / mr.count) * Math.PI * 2;
      const px = Math.cos(a) * mr.rx;
      const py = -0.242 + Math.sin(a) * mr.ry;
      const pz = sampleFaceSurfaceZ(px, py) + 0.01;
      const isLower = Math.sin(a) < 0;

      headVertices.push({
        bx: px,
        by: py,
        bz: pz,
        brightness: mr.bright,
        sizeMult: mr.size,
        jawWeight: isLower ? 0.78 : 0.12,
        skipDot: false,
        isFront: true,
      });
    }
  });

  for (let i = 0; i < 85; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const radius = 0.95 + Math.random() * 1.15;
    ambientBokeh.push({
      x: radius * Math.sin(phi) * Math.cos(theta),
      y: radius * Math.cos(phi) * 1.15,
      z: radius * Math.sin(phi) * Math.sin(theta),
      size: 1.1 + Math.random() * 2.8,
      alpha: 0.14 + Math.random() * 0.42,
      speed: 0.25 + Math.random() * 0.55,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

buildHumanoidPointCloud();

// ==========================================================
// 5. INTERACTIVE CAMERA, GAZE & AUDIO-REACTIVE RENDER LOOP
// ==========================================================
let targetYaw = -0.28;
let targetPitch = 0.03;
let currentYaw = -0.28;
let currentPitch = 0.03;
let pointerX = 0;
let pointerY = 0;
let isDragging = false;
let downX = 0;
let downY = 0;
let lastX = 0;
let lastY = 0;

canvas.addEventListener("pointerdown", (e) => {
  isDragging = true;
  downX = lastX = e.clientX;
  downY = lastY = e.clientY;
});

window.addEventListener("pointermove", (e) => {
  pointerX = (e.clientX / width) * 2 - 1;
  pointerY = (e.clientY / height) * 2 - 1;

  if (isDragging) {
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    targetYaw += dx * 0.0075;
    targetPitch = Math.max(-0.52, Math.min(0.52, targetPitch + dy * 0.0055));
    lastX = e.clientX;
    lastY = e.clientY;
  }
});

window.addEventListener("pointerup", (e) => {
  if (isDragging && Math.hypot(e.clientX - downX, e.clientY - downY) < 6) {
    unlockAudioSystems();
    if (!isSpeaking && !isThinking && startupGreeted) {
      speakText("At your service, Rami.");
    }
  }
  isDragging = false;
});

let blinkAmount = 0;
let nextBlink = performance.now() + 2600;
let smoothMouth = 0;

function render(now) {
  requestAnimationFrame(render);
  const t = now * 0.001;

  if (now > nextBlink) {
    const p = (now - nextBlink) / 165;
    if (p >= 1) {
      blinkAmount = 0;
      nextBlink = now + 2800 + Math.random() * 3400;
    } else {
      blinkAmount = Math.sin(p * Math.PI);
    }
  }

  let targetMouth = 0;
  if (isSpeaking) {
    if (analyserNode && analyserData && currentAudio && !currentAudio.paused) {
      analyserNode.getByteFrequencyData(analyserData);
      let sum = 0;
      for (let i = 2; i < 28; i++) sum += analyserData[i];
      liveAudioLevel = Math.min(1, (sum / 26) / 115);
      targetMouth = Math.max(0.12, liveAudioLevel * 1.15);
    } else {
      targetMouth = Math.max(
        0.12,
        0.48 + 0.34 * Math.sin(t * 17) + 0.18 * Math.sin(t * 28 + 0.9)
      );
    }
  }
  smoothMouth += (targetMouth - smoothMouth) * 0.32;

  const idleYaw = Math.sin(t * 0.5) * 0.075 + pointerX * 0.2;
  const idlePitch = Math.cos(t * 0.42) * 0.035 + pointerY * 0.12;

  currentYaw += (targetYaw + idleYaw - currentYaw) * 0.08;
  currentPitch += (targetPitch + idlePitch - currentPitch) * 0.08;

  const cosY = Math.cos(currentYaw);
  const sinY = Math.sin(currentYaw);
  const cosP = Math.cos(currentPitch);
  const sinP = Math.sin(currentPitch);

  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, width, height);

  const cx = width * 0.5;
  const cy = height * 0.41;
  const scale = Math.min(width * 0.47, height * 0.32);
  const fov = 3.5;

  function project(x, y, z) {
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;
    const p = fov / (fov - z2);
    return {
      sx: cx + x1 * scale * p,
      sy: cy - y2 * scale * p,
      z: z2,
      p,
    };
  }

  const projected = new Array(headVertices.length);
  const renderDots = [];

  for (let i = 0; i < headVertices.length; i++) {
    const v = headVertices[i];
    const dy = -smoothMouth * 0.085 * v.jawWeight;
    const dz = -smoothMouth * 0.022 * v.jawWeight;
    const pt = project(v.bx, v.by + dy, v.bz + dz);
    projected[i] = pt;

    if (!v.skipDot && v.brightness > 0.04) {
      renderDots.push({
        sx: pt.sx,
        sy: pt.sy,
        z: pt.z,
        p: pt.p,
        brightness: v.brightness + v.jawWeight * smoothMouth * 0.25,
        sizeMult: v.sizeMult,
      });
    }
  }

  const lookX = pointerX * 0.012;
  const lookY = -pointerY * 0.009;

  for (let i = 0; i < eyeDetails.length; i++) {
    const ed = eyeDetails[i];
    let x = ed.bx;
    let y = ed.cy + ed.offsetY;
    let z = ed.bz;

    if (ed.isIris) {
      x += lookX;
      y += lookY;
    } else if (ed.isUpperLid) {
      y = ed.cy + ed.offsetY * (1 - blinkAmount * 0.92);
    }

    const pt = project(x, y, z);
    renderDots.push({
      sx: pt.sx,
      sy: pt.sy,
      z: pt.z,
      p: pt.p,
      brightness: ed.brightness * (ed.isIris ? 1 - blinkAmount * 0.9 : 1),
      sizeMult: ed.sizeMult,
    });
  }

  ctx.lineWidth = 0.6;
  for (let i = 0; i < meshEdges.length; i++) {
    const [aIdx, bIdx] = meshEdges[i];
    const a = projected[aIdx];
    const b = projected[bIdx];
    const avgZ = (a.z + b.z) * 0.5;
    if (avgZ > -0.25) {
      const alpha = Math.min(0.13, Math.max(0, (avgZ + 0.25) * 0.12));
      ctx.strokeStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.stroke();
    }
  }

  renderDots.sort((a, b) => a.z - b.z);

  const focalZ = 0.55;

  for (let i = 0; i < renderDots.length; i++) {
    const d = renderDots[i];
    const depthNorm = Math.max(0, Math.min(1, (d.z + 0.85) / 1.8));
    const focalDist = Math.abs(d.z - focalZ);

    const bokehBlur = Math.max(0, focalDist - 0.35);
    const coreRadius = Math.max(0.7, (0.88 + depthNorm * 1.15) * d.p * d.sizeMult);
    const alpha = Math.min(
      1,
      (0.14 + Math.pow(depthNorm, 1.3) * 0.86) * d.brightness * (1 - bokehBlur * 0.35)
    );

    if (bokehBlur > 0.05 || depthNorm > 0.72) {
      const haloRadius = coreRadius * (1.8 + bokehBlur * 3.2);
      const haloAlpha = alpha * (bokehBlur > 0.05 ? 0.24 : 0.18);
      ctx.fillStyle = `rgba(255, 255, 255, ${haloAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(d.sx, d.sy, haloRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(d.sx, d.sy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
  }

  for (let i = 0; i < ambientBokeh.length; i++) {
    const ap = ambientBokeh[i];
    const drift = Math.sin(t * ap.speed + ap.phase) * 0.07;
    const pt = project(ap.x, ap.y + drift, ap.z);
    const a = ap.alpha * (0.65 + 0.35 * Math.sin(t * 1.6 + ap.phase));
    ctx.fillStyle = `rgba(255, 255, 255, ${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(pt.sx, pt.sy, ap.size * pt.p, 0, Math.PI * 2);
    ctx.fill();
  }
}

requestAnimationFrame(render);

// ==========================================================
// 6. STARTUP VOICE GREETING ON APP OPEN
// ==========================================================
const STARTUP_GREETING = "Hello sir Rami, what can I do for you?";

function playStartupGreeting(fromInteraction = false, target = null) {
  if (startupGreeted || !voiceEnabled) return;
  if (fromInteraction && target && target.closest("button, textarea")) {
    startupGreeted = true;
    return;
  }
  unlockAudioSystems();
  if (fromInteraction) startupGreeted = true;
  speakText(STARTUP_GREETING, true);
}

window.addEventListener("load", () => {
  setTimeout(() => playStartupGreeting(false), 300);
});

["touchstart", "click"].forEach((evt) => {
  window.addEventListener(evt, (e) => playStartupGreeting(true, e.target), { once: true });
});
</script>
