<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>RAMI AI</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: #000000;
  color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow: hidden;
}

/* Fullscreen 3D Canvas */
#faceCanvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  z-index: 1;
}

/* Minimalist Futuristic HUD Overlay */
.hud {
  position: fixed;
  inset: 0;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  pointer-events: none;
}

header {
  padding: 18px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,0.85), rgba(0,0,0,0));
}

.logo {
  letter-spacing: 6px;
  font-size: 18px;
  font-weight: 500;
  color: #ffffff;
  text-shadow: 0 0 12px rgba(255, 255, 255, 0.45);
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: auto;
}

.status {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: rgba(255, 255, 255, 0.75);
  text-transform: uppercase;
}

.status.speaking {
  color: #ffffff;
  text-shadow: 0 0 10px #ffffff;
}

.voice-toggle {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #ffffff;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 6px 10px;
  border-radius: 20px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.voice-toggle.muted {
  opacity: 0.45;
}

/* Bottom Chat & Controls */
.bottom-dock {
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
  padding: 12px 16px 22px;
  background: linear-gradient(to top, rgba(0,0,0,0.96) 55%, rgba(0,0,0,0));
  pointer-events: auto;
}

#messages {
  max-height: 26vh;
  overflow-y: auto;
  margin-bottom: 12px;
  padding-right: 4px;
  scrollbar-width: none;
}

#messages::-webkit-scrollbar {
  display: none;
}

.message {
  padding: 10px 14px;
  margin: 8px 0;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  background: rgba(12, 12, 12, 0.72);
  backdrop-filter: blur(10px);
  font-size: 14px;
  line-height: 1.45;
  color: rgba(255, 255, 255, 0.92);
  white-space: pre-wrap;
}

.message strong {
  font-size: 11px;
  letter-spacing: 2px;
  color: rgba(255, 255, 255, 0.55);
  text-transform: uppercase;
}

.controls {
  display: flex;
  gap: 8px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 14px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 255, 255, 0.22);
  background: rgba(15, 15, 15, 0.85);
  color: #ffffff;
  font-size: 16px;
  outline: none;
  backdrop-filter: blur(10px);
}

input::placeholder {
  color: rgba(255, 255, 255, 0.38);
}

input:focus {
  border-color: rgba(255, 255, 255, 0.65);
}

button.action-btn {
  padding: 14px 16px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.1);
  color: #ffffff;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: background 0.2s, border-color 0.2s;
}

button.action-btn:active {
  background: rgba(255, 255, 255, 0.28);
  border-color: #ffffff;
}

button.listening {
  background: rgba(255, 255, 255, 0.28);
  border-color: #ffffff;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.4);
}
</style>
</head>

<body>

<canvas id="faceCanvas"></canvas>

<div class="hud">
  <header>
    <div class="logo">R.A.M.I</div>
    <div class="header-right">
      <div id="statusText" class="status">● ONLINE</div>
      <button id="voiceBtn" class="voice-toggle" onclick="toggleVoice()">🔊 VOICE ON</button>
    </div>
  </header>

  <div class="bottom-dock">
    <div id="messages">
      <div class="message">
        <strong>RAMI AI</strong><br>
        Good day, Rami. My neural interface is online. Tap the microphone or type below to speak with me.
      </div>
    </div>

    <div class="controls">
      <input id="input" placeholder="Talk to RAMI..." autocomplete="off">
      <button class="action-btn" onclick="sendMessage()">Send</button>
      <button id="micBtn" class="action-btn" onclick="listen()">🎙️</button>
    </div>
  </div>
</div>

<script>
const WORKER_URL = "https://jarvis-worker.5rk2sbwzjp.workers.dev/";

// ==========================================
// 1. VOICE (TEXT-TO-SPEECH & SPEECH-TO-TEXT)
// ==========================================
let voiceEnabled = true;
let isSpeaking = false;
let speechUnlocked = false;
let preferredVoice = null;

function loadVoices() {
  if (!("speechSynthesis" in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;

  preferredVoice =
    voices.find(v => v.lang.startsWith("en") && (v.name.includes("Daniel") || v.name.includes("Alex") || v.name.includes("Google UK English Male") || v.name.includes("Arthur"))) ||
    voices.find(v => v.lang.startsWith("en") && v.localService) ||
    voices.find(v => v.lang.startsWith("en")) ||
    voices[0];
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// Unlock iOS Safari audio on first touch/click
function unlockSpeech() {
  if (speechUnlocked || !("speechSynthesis" in window)) return;
  const silent = new SpeechSynthesisUtterance("");
  silent.volume = 0;
  window.speechSynthesis.speak(silent);
  speechUnlocked = true;
}
window.addEventListener("touchstart", unlockSpeech, { once: true });
window.addEventListener("click", unlockSpeech, { once: true });

function setStatus(label, speaking = false) {
  const el = document.getElementById("statusText");
  el.textContent = "● " + label;
  if (speaking) el.classList.add("speaking");
  else el.classList.remove("speaking");
}

function toggleVoice() {
  unlockSpeech();
  voiceEnabled = !voiceEnabled;
  const btn = document.getElementById("voiceBtn");
  if (voiceEnabled) {
    btn.textContent = "🔊 VOICE ON";
    btn.classList.remove("muted");
    speakText("Voice output enabled, Rami.");
  } else {
    btn.textContent = "🔇 MUTED";
    btn.classList.add("muted");
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    isSpeaking = false;
    setStatus("ONLINE", false);
  }
}

function speakText(rawText) {
  if (!voiceEnabled || !("speechSynthesis" in window)) return;

  // Clean markdown symbols before speaking
  const cleanText = rawText
    .replace(/[*#_`~>-]/g, " ")
    .replace(/\s+/g, " ")
    .trim();

  if (!cleanText) return;

  window.speechSynthesis.cancel();
  if (!preferredVoice) loadVoices();

  const utterance = new SpeechSynthesisUtterance(cleanText);
  if (preferredVoice) utterance.voice = preferredVoice;
  utterance.rate = 0.98;
  utterance.pitch = 0.95;

  utterance.onstart = () => {
    isSpeaking = true;
    setStatus("SPEAKING", true);
  };

  utterance.onend = () => {
    isSpeaking = false;
    setStatus("ONLINE", false);
  };

  utterance.onerror = () => {
    isSpeaking = false;
    setStatus("ONLINE", false);
  };

  // Fallback timer in case mobile Safari misses onend
  const estimatedMs = Math.max(1800, cleanText.length * 65);
  clearTimeout(window._speechFallbackTimer);
  window._speechFallbackTimer = setTimeout(() => {
    if (isSpeaking && !window.speechSynthesis.speaking) {
      isSpeaking = false;
      setStatus("ONLINE", false);
    }
  }, estimatedMs + 1500);

  window.speechSynthesis.speak(utterance);
}

// ==========================================
// 2. CHAT & CLOUDFLARE WORKER INTEGRATION
// ==========================================
function addMessage(sender, text) {
  const box = document.getElementById("messages");
  const message = document.createElement("div");
  message.className = "message";

  const title = document.createElement("strong");
  title.textContent = sender;

  const content = document.createElement("div");
  content.textContent = text;

  message.append(title, document.createElement("br"), content);
  box.appendChild(message);
  box.scrollTop = box.scrollHeight;
  return content;
}

async function sendMessage() {
  unlockSpeech();
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text) return;

  addMessage("RAMI", text);
  input.value = "";
  setStatus("THINKING", false);

  const replyContent = addMessage("RAMI AI", "Processing...");

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Server error (" + response.status + ")");
    }

    replyContent.textContent = data.reply;
    document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    setStatus("ONLINE", false);
    speakText(data.reply);
  } catch (err) {
    replyContent.textContent = "Error: " + err.message;
    setStatus("ONLINE", false);
  }
}

function listen() {
  unlockSpeech();
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    const msg = "Voice input is not supported in this browser. Please type your message.";
    addMessage("RAMI AI", msg);
    speakText(msg);
    return;
  }

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    isSpeaking = false;
  }

  const micBtn = document.getElementById("micBtn");
  const recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.interimResults = false;

  micBtn.classList.add("listening");
  setStatus("LISTENING", true);
  recognition.start();

  recognition.onresult = function(event) {
    micBtn.classList.remove("listening");
    document.getElementById("input").value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = function() {
    micBtn.classList.remove("listening");
    setStatus("ONLINE", false);
  };

  recognition.onend = function() {
    micBtn.classList.remove("listening");
    if (!isSpeaking) setStatus("ONLINE", false);
  };
}

document.getElementById("input").addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

// ==========================================
// 3. INTERACTIVE 3D WHITE-DOT HUMANOID FACE
// ==========================================
const canvas = document.getElementById("faceCanvas");
const ctx = canvas.getContext("2d");

let width = 0;
let height = 0;
let dpr = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = width * dpr;
  canvas.height = height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resize);
resize();

// Gaussian helper for anatomical sculpting
function gauss(x, mu, sigma) {
  const d = (x - mu) / sigma;
  return Math.exp(-0.5 * d * d);
}

// Build 3D Humanoid Head Mesh & Particle Cloud
const U_STEPS = 66; // horizontal rings
const V_STEPS = 54; // vertical rings
const headVertices = [];
const meshEdges = [];
const eyeParticles = [];
const ambientParticles = [];

function createHeadGeometry() {
  for (let iv = 0; iv <= V_STEPS; iv++) {
    const v = iv / V_STEPS; // 0 = top of crown, 1 = base of neck
    for (let iu = 0; iu < U_STEPS; iu++) {
      const u = (iu / U_STEPS) * Math.PI * 2 - Math.PI; // -PI to PI, 0 = front center

      // Vertical coordinate Y (+Y is up)
      let y = 1.28 - v * 2.52;

      // Base cranium + jaw + neck silhouette
      let rx = 0.76;
      let rz = 0.86;

      if (v < 0.34) {
        // Upper cranium dome
        const t = v / 0.34;
        const dome = Math.sin(t * Math.PI * 0.5);
        rx = 0.76 * Math.pow(dome, 0.62);
        rz = 0.86 * Math.pow(dome, 0.62);
      } else if (v < 0.72) {
        // Mid-face to chin taper
        const t = (v - 0.34) / 0.38;
        rx = 0.76 * (1 - 0.38 * Math.pow(t, 1.45));
        rz = 0.86 * (1 - 0.24 * Math.pow(t, 1.35));
      } else if (v < 0.79) {
        // Under-chin tuck into neck
        const t = (v - 0.72) / 0.07;
        const smooth = t * t * (3 - 2 * t);
        rx = 0.47 * (1 - smooth) + 0.39 * smooth;
        rz = 0.65 * (1 - smooth) + 0.41 * smooth;
      } else {
        // Neck & slight collar flare
        const t = (v - 0.79) / 0.21;
        const flare = Math.pow(t, 2.2) * 0.22;
        rx = 0.39 + flare;
        rz = 0.41 + flare * 0.7;
      }

      let x = rx * Math.sin(u);
      let z = rz * Math.cos(u);

      // Flatten temples slightly
      const templeWeight = gauss(v, 0.36, 0.12) * gauss(Math.abs(u), 1.05, 0.35);
      x *= (1 - 0.08 * templeWeight);

      // Back of skull fullness (occipital bun)
      if (Math.abs(u) > 1.7) {
        const backWeight = gauss(v, 0.34, 0.16) * gauss(Math.abs(u), Math.PI, 0.7);
        z -= 0.14 * backWeight;
      }

      // Sculpt facial anatomy on front hemisphere
      let brightness = 0.55;
      let sizeMult = 1.0;
      let jawWeight = 0;

      if (Math.abs(u) < 1.55 && v > 0.14 && v < 0.75) {
        const absU = Math.abs(u);

        // Brow ridge
        const brow = gauss(v, 0.345, 0.024) * gauss(absU, 0.28, 0.26);
        z += 0.085 * brow;

        // Eye sockets (recessed)
        const socket = gauss(v, 0.395, 0.032) * gauss(absU, 0.31, 0.12);
        z -= 0.145 * socket;

        // Nose bridge & tip
        const noseBridge = Math.exp(-Math.pow((v - 0.45) / 0.095, 2)) * gauss(u, 0, 0.085) * (v > 0.34 && v < 0.55 ? 1 : 0);
        const noseTip = gauss(v, 0.522, 0.025) * gauss(u, 0, 0.095);
        const nostril = gauss(v, 0.532, 0.020) * gauss(absU, 0.135, 0.055);
        z += 0.14 * noseBridge + 0.16 * noseTip + 0.085 * nostril;

        // Cheekbones
        const cheek = gauss(v, 0.465, 0.055) * gauss(absU, 0.44, 0.18);
        z += 0.075 * cheek;
        x += Math.sign(u) * 0.045 * cheek;

        // Philtrum & Lips
        const upperLip = gauss(v, 0.592, 0.015) * gauss(absU, 0.08, 0.13);
        const lipSeam = gauss(v, 0.610, 0.009) * gauss(u, 0, 0.18);
        const lowerLip = gauss(v, 0.628, 0.017) * gauss(u, 0, 0.15);
        z += 0.095 * upperLip - 0.065 * lipSeam + 0.092 * lowerLip;

        // Chin
        const chin = gauss(v, 0.692, 0.032) * gauss(u, 0, 0.18);
        z += 0.095 * chin;

        // Jawline definition
        const jaw = gauss(v, 0.63, 0.06) * gauss(absU, 0.68, 0.22);
        x += Math.sign(u) * 0.035 * jaw;

        // Highlight key facial landmarks with brighter, slightly larger white dots
        const landmarkBoost = Math.max(brow * 0.6, noseTip * 0.9, upperLip * 0.85, lowerLip * 0.85, cheek * 0.5, chin * 0.6);
        brightness = 0.65 + landmarkBoost * 0.55;
        sizeMult = 1.0 + landmarkBoost * 0.45;

        // Weight for dynamic speech jaw animation (lower lip + chin)
        if (v > 0.606 && v < 0.745 && absU < 0.48) {
          jawWeight = Math.sin(Math.min(1, (v - 0.606) / 0.06) * Math.PI * 0.5) *
                      (1 - Math.max(0, (v - 0.69) / 0.055)) *
                      Math.cos((absU / 0.48) * Math.PI * 0.5);
        }
      }

      // Ears
      const ear = gauss(v, 0.47, 0.065) * gauss(Math.abs(u), 1.52, 0.09);
      if (ear > 0.15) {
        x += Math.sign(u) * 0.075 * ear;
        z -= 0.03 * ear;
        brightness += 0.2 * ear;
      }

      // Subtle organic micro-jitter so it feels holographic rather than rigid
      const jitter = 0.008;
      x += (Math.random() - 0.5) * jitter;
      y += (Math.random() - 0.5) * jitter;
      z += (Math.random() - 0.5) * jitter;

      const idx = headVertices.length;
      headVertices.push({
        bx: x,
        by: y,
        bz: z,
        brightness,
        sizeMult,
        jawWeight,
        isFront: Math.abs(u) < 1.35 && v > 0.18 && v < 0.76
      });

      // Connect adjacent grid points on the face for delicate biometric mesh lines
      if (iv > 0 && iu > 0) {
        const prevU = idx - 1;
        const prevV = idx - U_STEPS;
        if (headVertices[idx].isFront) {
          meshEdges.push([idx, prevU]);
          meshEdges.push([idx, prevV]);
        }
      }
    }
  }

  // Add high-detail Eyelids & Glowing Irises inside both eye sockets
  [-1, 1].forEach(side => {
    const cx = side * 0.265;
    const cy = 0.285;
    const cz = 0.735;

    // Upper & lower eyelid dot contours (32 points per eye)
    const lidCount = 32;
    for (let i = 0; i < lidCount; i++) {
      const a = (i / lidCount) * Math.PI * 2;
      const ex = cx + Math.cos(a) * 0.115;
      const isUpper = Math.sin(a) > 0;
      const eyOffset = Math.sin(a) * 0.048;
      const ez = cz - Math.pow(Math.cos(a), 2) * 0.035 + 0.025;

      eyeParticles.push({
        bx: ex,
        cy,
        eyOffset,
        bz: ez,
        isUpper,
        isIris: false,
        side,
        brightness: 1.15,
        sizeMult: 1.25
      });
    }

    // Iris ring + pupil center
    const irisCount = 16;
    for (let i = 0; i < irisCount; i++) {
      const a = (i / irisCount) * Math.PI * 2;
      eyeParticles.push({
        bx: cx + Math.cos(a) * 0.034,
        cy,
        eyOffset: Math.sin(a) * 0.034,
        bz: cz + 0.015,
        isUpper: false,
        isIris: true,
        side,
        brightness: 1.25,
        sizeMult: 1.15
      });
    }
    // Bright pupil core
    eyeParticles.push({
      bx: cx,
      cy,
      eyOffset: 0,
      bz: cz + 0.022,
      isUpper: false,
      isIris: true,
      side,
      brightness: 1.4,
      sizeMult: 1.6
    });
  });

  // Floating ambient bokeh particles in 3D space around the head
  for (let i = 0; i < 95; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const radius = 1.05 + Math.random() * 1.15;
    ambientParticles.push({
      x: radius * Math.sin(phi) * Math.cos(theta),
      y: radius * Math.cos(phi) * 1.1,
      z: radius * Math.sin(phi) * Math.sin(theta),
      size: 0.8 + Math.random() * 2.2,
      alpha: 0.15 + Math.random() * 0.55,
      speed: 0.3 + Math.random() * 0.7,
      phase: Math.random() * Math.PI * 2
    });
  }
}

createHeadGeometry();

// ==========================================
// 4. TOUCH / MOUSE INTERACTION & ANIMATION
// ==========================================
let targetYaw = -0.22;   // subtle three-quarter futuristic angle by default
let targetPitch = 0.04;
let currentYaw = -0.22;
let currentPitch = 0.04;
let pointerX = 0;
let pointerY = 0;
let isDragging = false;
let lastTouchX = 0;
let lastTouchY = 0;

canvas.addEventListener("pointerdown", e => {
  isDragging = true;
  lastTouchX = e.clientX;
  lastTouchY = e.clientY;
});

window.addEventListener("pointermove", e => {
  pointerX = (e.clientX / width) * 2 - 1;
  pointerY = (e.clientY / height) * 2 - 1;

  if (isDragging) {
    const dx = e.clientX - lastTouchX;
    const dy = e.clientY - lastTouchY;
    targetYaw += dx * 0.0075;
    targetPitch = Math.max(-0.55, Math.min(0.55, targetPitch + dy * 0.0055));
    lastTouchX = e.clientX;
    lastTouchY = e.clientY;
  }
});

window.addEventListener("pointerup", () => {
  isDragging = false;
});

// Tap on face to greet
canvas.addEventListener("click", e => {
  if (Math.abs(e.clientX - lastTouchX) < 5 && Math.abs(e.clientY - lastTouchY) < 5) {
    unlockSpeech();
    if (!isSpeaking) {
      speakText("At your service, Rami.");
    }
  }
});

let blinkAmount = 0;
let nextBlinkTime = performance.now() + 2500;
let speakAmount = 0;

function render(now) {
  requestAnimationFrame(render);

  const t = now * 0.001;

  // Periodic natural eye blink
  if (now > nextBlinkTime) {
    const blinkProgress = (now - nextBlinkTime) / 170; // 170ms blink duration
    if (blinkProgress >= 1) {
      blinkAmount = 0;
      nextBlinkTime = now + 2600 + Math.random() * 3400;
    } else {
      blinkAmount = Math.sin(blinkProgress * Math.PI);
    }
  }

  // Smooth speech mouth movement
  if (isSpeaking) {
    const syllable =
      0.5 +
      0.32 * Math.sin(t * 17.5) +
      0.18 * Math.sin(t * 29.0 + 1.1);
    speakAmount += (Math.max(0.1, syllable) - speakAmount) * 0.35;
  } else {
    speakAmount += (0 - speakAmount) * 0.2;
  }

  // Gentle idle breathing + subtle pointer gaze tracking
  const idleYaw = Math.sin(t * 0.55) * 0.09 + pointerX * 0.22;
  const idlePitch = Math.cos(t * 0.45) * 0.04 + pointerY * 0.14;

  currentYaw += (targetYaw + idleYaw - currentYaw) * 0.08;
  currentPitch += (targetPitch + idlePitch - currentPitch) * 0.08;

  const cosY = Math.cos(currentYaw);
  const sinY = Math.sin(currentYaw);
  const cosP = Math.cos(currentPitch);
  const sinP = Math.sin(currentPitch);

  // Pure black background
  ctx.fillStyle = "#000000";
  ctx.fillRect(0, 0, width, height);

  // Position head slightly above center so bottom chat dock never covers the face
  const centerX = width * 0.5;
  const centerY = height * 0.41;
  const scale = Math.min(width * 0.46, height * 0.31);
  const fov = 3.4;

  function project(x, y, z) {
    // Rotate around Y (yaw)
    const x1 = x * cosY - z * sinY;
    const z1 = x * sinY + z * cosY;
    // Rotate around X (pitch)
    const y2 = y * cosP - z1 * sinP;
    const z2 = y * sinP + z1 * cosP;

    const perspective = fov / (fov - z2);
    return {
      sx: centerX + x1 * scale * perspective,
      sy: centerY - y2 * scale * perspective,
      z: z2,
      p: perspective
    };
  }

  // Project all head vertices
  const projectedHead = new Array(headVertices.length);
  const drawList = [];

  for (let i = 0; i < headVertices.length; i++) {
    const v = headVertices[i];
    const dy = -speakAmount * 0.095 * v.jawWeight;
    const dz = -speakAmount * 0.025 * v.jawWeight;
    const proj = project(v.bx, v.by + dy, v.bz + dz);
    projectedHead[i] = proj;

    drawList.push({
      sx: proj.sx,
      sy: proj.sy,
      z: proj.z,
      p: proj.p,
      brightness: v.brightness + (v.jawWeight * speakAmount * 0.35),
      sizeMult: v.sizeMult
    });
  }

  // Project eyes (blinking eyelids + tracking irises)
  const eyeLookX = pointerX * 0.016;
  const eyeLookY = -pointerY * 0.012;

  for (let i = 0; i < eyeParticles.length; i++) {
    const ep = eyeParticles[i];
    let x = ep.bx;
    let y = ep.cy + ep.eyOffset;
    let z = ep.bz;

    if (ep.isIris) {
      x += eyeLookX;
      y += eyeLookY;
    } else if (ep.isUpper) {
      y = ep.cy + ep.eyOffset * (1 - blinkAmount * 0.92);
    }

    const proj = project(x, y, z);
    drawList.push({
      sx: proj.sx,
      sy: proj.sy,
      z: proj.z,
      p: proj.p,
      brightness: ep.brightness * (ep.isIris ? (1 - blinkAmount * 0.85) : 1),
      sizeMult: ep.sizeMult
    });
  }

  // 1. Draw delicate translucent biometric mesh lines on front-facing triangles
  ctx.lineWidth = 0.65;
  for (let i = 0; i < meshEdges.length; i++) {
    const [aIdx, bIdx] = meshEdges[i];
    const a = projectedHead[aIdx];
    const b = projectedHead[bIdx];
    const avgZ = (a.z + b.z) * 0.5;
    if (avgZ > -0.15) {
      const lineAlpha = Math.min(0.14, Math.max(0, (avgZ + 0.15) * 0.13));
      ctx.strokeStyle = `rgba(255, 255, 255, ${lineAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.moveTo(a.sx, a.sy);
      ctx.lineTo(b.sx, b.sy);
      ctx.stroke();
    }
  }

  // 2. Sort particles back-to-front for authentic 3D depth & bokeh glow
  drawList.sort((a, b) => a.z - b.z);

  for (let i = 0; i < drawList.length; i++) {
    const pt = drawList[i];
    // Depth normalization (-0.9 back of head to +1.0 nose tip)
    const depthNorm = Math.max(0, Math.min(1, (pt.z + 0.9) / 1.9));
    const alpha = Math.min(1, (0.14 + Math.pow(depthNorm, 1.35) * 0.86) * pt.brightness);
    const radius = Math.max(0.75, (0.95 + depthNorm * 1.45) * pt.p * pt.sizeMult);

    // Soft outer halo for near/bright dots or deep bokeh blur for back-edge dots
    if (depthNorm > 0.68 || depthNorm < 0.22) {
      const haloRadius = radius * (depthNorm > 0.68 ? 2.5 : 2.9);
      const haloAlpha = alpha * (depthNorm > 0.68 ? 0.22 : 0.14);
      ctx.fillStyle = `rgba(255, 255, 255, ${haloAlpha.toFixed(3)})`;
      ctx.beginPath();
      ctx.arc(pt.sx, pt.sy, haloRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Crisp white core dot
    ctx.fillStyle = `rgba(255, 255, 255, ${alpha.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(pt.sx, pt.sy, radius, 0, Math.PI * 2);
    ctx.fill();
  }

  // 3. Ambient floating dust particles around the hologram
  for (let i = 0; i < ambientParticles.length; i++) {
    const ap = ambientParticles[i];
    const driftY = Math.sin(t * ap.speed + ap.phase) * 0.08;
    const proj = project(ap.x, ap.y + driftY, ap.z);
    const pulse = 0.65 + 0.35 * Math.sin(t * 1.8 + ap.phase);
    const a = ap.alpha * pulse;
    ctx.fillStyle = `rgba(255, 255, 255, ${a.toFixed(3)})`;
    ctx.beginPath();
    ctx.arc(proj.sx, proj.sy, ap.size * proj.p, 0, Math.PI * 2);
    ctx.fill();
  }
}

requestAnimationFrame(render);
</script>

</body>
